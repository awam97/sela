name: Build & Deploy Sela Platform

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Debug APK
        run: |
          cd mobile_app
          flutter build apk --debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sela-android-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    name: Build iOS Native App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build iOS Application (Release Mode)
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sela-ios-release-app
          path: mobile_app/build/ios/iphoneos/Runner.app

  deploy-backend:
    name: Sync Webapp to Live Server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync PHP Webapp via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        if: ${{ secrets.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/flutter-sdk/**
            **/android-sdk/**
            **/mobile_app/**
            **/.temp/**
            **/orgsly_sela.sql
            **/writable/**

  publish-release:
    name: Publish Public GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ios]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download iOS App
        uses: actions/download-artifact@v4
        with:
          name: sela-ios-release-app
          path: ./Runner.app

      - name: Package iOS IPA
        run: |
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r sela.ipa Payload

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          files: |
            sela.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
