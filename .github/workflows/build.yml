name: Build iOS & Android Apps

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sela-android-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS Native App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build iOS Application (Release Mode)
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sela-ios-release-app
          path: mobile_app/build/ios/iphoneos/Runner.app

  publish-release:
    name: Publish Public GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download iOS App
        uses: actions/download-artifact@v4
        with:
          name: sela-ios-release-app
          path: ./Runner.app

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: sela-android-release-apk
          path: ./

      - name: Package iOS IPA
        run: |
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r sela.ipa Payload

      - name: Rename Android APK
        run: |
          mv app-release.apk sela.apk

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          files: |
            sela.ipa
            sela.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
